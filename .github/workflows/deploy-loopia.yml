name: Deploy to Loopia
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run build
      - name: Upload site over FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.LOOPIA_FTP_SERVER }}
          username: ${{ secrets.LOOPIA_FTP_USERNAME }}
          password: ${{ secrets.LOOPIA_FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./dist/
          server-dir: ${{ secrets.LOOPIA_FTP_PATH }}
          dangerous-clean-slate: false
